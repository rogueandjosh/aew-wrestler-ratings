name: Current champions

on:
  schedule:
    - cron: '30 6 * * *'     # daily, 06:30 UTC — title changes show up within a day
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15        # stop a stuck run instead of letting it go on for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read current champions from Wikipedia
        run: node scripts/update-champions.mjs

      - name: Commit champions file if changed
        run: |
          if [ -z "$(git status --porcelain champions.json)" ]; then
            echo "No champion changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          git add champions.json
          git commit -m "Current champions: update from Wikipedia"
          git pull --rebase
          git push
