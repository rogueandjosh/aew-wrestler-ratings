<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Wrestlers - AEW Wrestler Ratings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overlock:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Overlock', cursive;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        h1 {
            font-size: 2.5em;
            color: #ffd700;
            margin-bottom: 10px;
            font-weight: 900;
        }

        .subtitle {
            color: #999;
            font-size: 1.1em;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #ffd700;
            text-decoration: none;
            font-size: 1em;
            padding: 8px 16px;
            border: 1px solid #ffd700;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #ffd700;
            color: #1a1a2e;
        }

        /* Division Selection */
        .division-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .division-section h2 {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .division-options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .division-option {
            flex: 1;
            min-width: 150px;
        }

        .division-option input[type="radio"] {
            display: none;
        }

        .division-option label {
            display: block;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .division-option label:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .division-option input[type="radio"]:checked + label {
            background: #ffd700;
            color: #1a1a2e;
            border-color: #ffd700;
            font-weight: bold;
        }

        /* Wrestler Selection */
        .selection-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .selection-section h2 {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .wrestler-selectors {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .wrestler-selector {
            display: flex;
            flex-direction: column;
        }

        .wrestler-selector label {
            color: #ffd700;
            font-size: 0.9em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .wrestler-selector select {
            padding: 12px;
            font-size: 1em;
            font-family: 'Overlock', cursive;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .wrestler-selector select:hover {
            border-color: #ffd700;
        }

        .wrestler-selector select:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
        }

        .wrestler-selector select option {
            background: #1a1a2e;
            color: #fff;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            font-family: 'Overlock', cursive;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #ffd700;
            color: #1a1a2e;
        }

        .btn-primary:hover:not(:disabled) {
            background: #ffed4e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffd700;
            border: 1px solid #ffd700;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results Section (Placeholder for Phase 2-3) */
        .results-section {
            display: none;
            margin-top: 30px;
        }

        .results-section.active {
            display: block;
        }

        .stats-table-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .stats-table-container h2 {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .graph-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 25px;
        }

        .graph-container h2 {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px;
            color: #ffd700;
            font-size: 1.2em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Error State */
        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
            color: #ff6b6b;
        }

        /* Info Message */
        .info-message {
            text-align: center;
            color: #999;
            font-size: 0.95em;
            margin-top: 15px;
            font-style: italic;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .division-options {
                flex-direction: column;
            }

            .division-option {
                min-width: 100%;
            }

            .wrestler-selectors {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.6em;
            }

            .division-section,
            .selection-section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🥊 Compare Wrestlers</h1>
            <p class="subtitle">Side-by-side wrestler comparison</p>
            <a href="index.html" class="back-link">← Back to Rankings</a>
        </header>

        <main>
            <!-- Division Selection -->
            <section class="division-section">
                <h2>Select Division</h2>
                <div class="division-options">
                    <div class="division-option">
                        <input type="radio" id="div-mens" name="division" value="mens" checked>
                        <label for="div-mens">Men</label>
                    </div>
                    <div class="division-option">
                        <input type="radio" id="div-womens" name="division" value="womens">
                        <label for="div-womens">Women</label>
                    </div>
                    <div class="division-option">
                        <input type="radio" id="div-menstag" name="division" value="menstag">
                        <label for="div-menstag">Men's Tag Teams</label>
                    </div>
                    <div class="division-option">
                        <input type="radio" id="div-womenstag" name="division" value="womenstag">
                        <label for="div-womenstag">Women's Tag Teams</label>
                    </div>
                    <div class="division-option">
                        <input type="radio" id="div-trios" name="division" value="trios">
                        <label for="div-trios">Trios</label>
                    </div>
                    <div class="division-option">
                        <input type="radio" id="div-all" name="division" value="all">
                        <label for="div-all">All Divisions</label>
                    </div>
                </div>
            </section>

            <!-- Wrestler Selection -->
            <section class="selection-section">
                <h2>Select Wrestlers to Compare</h2>
                <div id="loadingMessage" class="loading" style="display: none;">
                    Loading wrestler data
                </div>
                <div id="errorMessage" class="error" style="display: none;"></div>
                
                <div id="wrestlerSelectors" class="wrestler-selectors">
                    <div class="wrestler-selector">
                        <label for="wrestler1">Wrestler 1</label>
                        <select id="wrestler1">
                            <option value="">-- Select Wrestler --</option>
                        </select>
                    </div>
                    <div class="wrestler-selector">
                        <label for="wrestler2">Wrestler 2</label>
                        <select id="wrestler2">
                            <option value="">-- Select Wrestler --</option>
                        </select>
                    </div>
                    <div class="wrestler-selector">
                        <label for="wrestler3">Wrestler 3 (Optional)</label>
                        <select id="wrestler3">
                            <option value="">-- Select Wrestler --</option>
                        </select>
                    </div>
                </div>

                <p class="info-message">Select at least 2 wrestlers to compare</p>

                <div class="action-buttons">
                    <button id="compareBtn" class="btn btn-primary" disabled>Compare Wrestlers</button>
                    <button id="clearBtn" class="btn btn-secondary">Clear All</button>
                    <button id="copyLinkBtn" class="btn btn-secondary" style="display: none;">📋 Copy Link</button>
                </div>
            </section>

            <!-- Results Section (Hidden until comparison is made) -->
            <section id="resultsSection" class="results-section">
                <div class="stats-table-container">
                    <h2>📊 Performance Comparison</h2>
                    <div id="statsTable">
                        <!-- Stats table will be inserted here in Phase 2 -->
                    </div>
                </div>

                <div class="graph-container">
                    <h2>📈 Rating History</h2>
                    <div id="graphCanvas">
                        <!-- Chart.js graph will be inserted here in Phase 3 -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Global variables
        let statisticsData = null;
        let selectedDivision = 'mens';

        // Initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            await loadStatisticsData();
            setupEventListeners();
            checkURLParams();
        });

        // Load statistics.json to get wrestler lists
        async function loadStatisticsData() {
            const loadingMsg = document.getElementById('loadingMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            try {
                loadingMsg.style.display = 'block';
                const response = await fetch('statistics.json');
                
                if (!response.ok) {
                    throw new Error('Failed to load statistics data');
                }
                
                statisticsData = await response.json();
                loadingMsg.style.display = 'none';
                
                // Populate dropdowns with initial division (mens)
                populateWrestlerDropdowns();
                
            } catch (error) {
                console.error('Error loading statistics:', error);
                loadingMsg.style.display = 'none';
                errorMsg.textContent = 'Error loading wrestler data. Please refresh the page.';
                errorMsg.style.display = 'block';
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Division radio buttons
            document.querySelectorAll('input[name="division"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    selectedDivision = e.target.value;
                    populateWrestlerDropdowns();
                    validateSelection();
                });
            });

            // Wrestler dropdowns
            ['wrestler1', 'wrestler2', 'wrestler3'].forEach(id => {
                document.getElementById(id).addEventListener('change', validateSelection);
            });

            // Compare button
            document.getElementById('compareBtn').addEventListener('click', compareWrestlers);

            // Clear button
            document.getElementById('clearBtn').addEventListener('click', clearSelection);

            // Copy link button
            document.getElementById('copyLinkBtn').addEventListener('click', copyShareLink);
        }

        // Populate wrestler dropdowns based on selected division
        function populateWrestlerDropdowns() {
            if (!statisticsData) return;

            const dropdowns = ['wrestler1', 'wrestler2', 'wrestler3'];
            let wrestlers = [];

            if (selectedDivision === 'all') {
                // Combine all divisions
                const divisions = ['mens', 'womens', 'menstag', 'womenstag', 'trios'];
                divisions.forEach(div => {
                    if (statisticsData[div]) {
                        statisticsData[div].forEach(w => {
                            wrestlers.push({
                                name: w.name,
                                division: div
                            });
                        });
                    }
                });
            } else {
                // Single division
                if (statisticsData[selectedDivision]) {
                    wrestlers = statisticsData[selectedDivision].map(w => ({
                        name: w.name,
                        division: selectedDivision
                    }));
                }
            }

            // Sort alphabetically
            wrestlers.sort((a, b) => a.name.localeCompare(b.name));

            // Populate each dropdown
            dropdowns.forEach(dropdownId => {
                const select = document.getElementById(dropdownId);
                const currentValue = select.value;
                
                select.innerHTML = '<option value="">-- Select Wrestler --</option>';
                
                wrestlers.forEach(wrestler => {
                    const option = document.createElement('option');
                    option.value = createSlug(wrestler.name);
                    
                    // Show division label for "All Divisions" mode
                    if (selectedDivision === 'all') {
                        const divLabel = getDivisionLabel(wrestler.division);
                        option.textContent = `${wrestler.name} (${divLabel})`;
                    } else {
                        option.textContent = wrestler.name;
                    }
                    
                    option.dataset.name = wrestler.name;
                    option.dataset.division = wrestler.division;
                    select.appendChild(option);
                });

                // Restore previous selection if still available
                if (currentValue) {
                    const optionExists = Array.from(select.options).some(opt => opt.value === currentValue);
                    if (optionExists) {
                        select.value = currentValue;
                    }
                }
            });
        }

        // Get human-readable division label
        function getDivisionLabel(div) {
            const labels = {
                'mens': 'Men',
                'womens': 'Women',
                'menstag': "Men's Tag",
                'womenstag': "Women's Tag",
                'trios': 'Trios'
            };
            return labels[div] || div;
        }

        // Create slug from wrestler name
        function createSlug(name) {
            return name.toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .trim();
        }

        // Validate selection and enable/disable compare button
        function validateSelection() {
            const wrestler1 = document.getElementById('wrestler1').value;
            const wrestler2 = document.getElementById('wrestler2').value;
            const compareBtn = document.getElementById('compareBtn');

            // Need at least 2 wrestlers selected
            const isValid = wrestler1 && wrestler2;
            compareBtn.disabled = !isValid;
        }

        // Compare wrestlers (Phase 2 implementation)
        async function compareWrestlers() {
            const wrestler1 = document.getElementById('wrestler1').value;
            const wrestler2 = document.getElementById('wrestler2').value;
            const wrestler3 = document.getElementById('wrestler3').value;

            console.log('Comparing:', { wrestler1, wrestler2, wrestler3 });

            // Show results section
            document.getElementById('resultsSection').classList.add('active');
            document.getElementById('copyLinkBtn').style.display = 'inline-block';

            // Update URL
            updateURL();

            // TODO: Phase 2 - Fetch wrestler data and build stats table
            // TODO: Phase 3 - Build line graph
            
            alert('Comparison functionality coming in Phase 2!');
        }

        // Clear all selections
        function clearSelection() {
            document.getElementById('wrestler1').value = '';
            document.getElementById('wrestler2').value = '';
            document.getElementById('wrestler3').value = '';
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('copyLinkBtn').style.display = 'none';
            validateSelection();
            
            // Clear URL
            window.history.pushState({}, '', 'wrestler-compare.html');
        }

        // Update URL with current selection
        function updateURL() {
            const wrestler1 = document.getElementById('wrestler1').value;
            const wrestler2 = document.getElementById('wrestler2').value;
            const wrestler3 = document.getElementById('wrestler3').value;

            const params = new URLSearchParams();
            params.set('division', selectedDivision);
            
            const wrestlers = [wrestler1, wrestler2, wrestler3].filter(w => w);
            if (wrestlers.length > 0) {
                params.set('wrestlers', wrestlers.join(','));
            }

            const newURL = `${window.location.pathname}?${params.toString()}`;
            window.history.pushState({}, '', newURL);
        }

        // Copy shareable link to clipboard
        async function copyShareLink() {
            const url = window.location.href;
            
            try {
                await navigator.clipboard.writeText(url);
                
                // Visual feedback
                const btn = document.getElementById('copyLinkBtn');
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.style.background = 'rgba(40, 167, 69, 0.3)';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 2000);
                
            } catch (error) {
                console.error('Failed to copy link:', error);
                alert('Failed to copy link. Please copy manually from the address bar.');
            }
        }

        // Check URL parameters on page load
        function checkURLParams() {
            const params = new URLSearchParams(window.location.search);
            const division = params.get('division');
            const wrestlers = params.get('wrestlers');

            if (division && wrestlers) {
                // Set division
                const divisionRadio = document.getElementById(`div-${division}`);
                if (divisionRadio) {
                    divisionRadio.checked = true;
                    selectedDivision = division;
                    populateWrestlerDropdowns();
                }

                // Set wrestlers (with small delay to ensure dropdowns are populated)
                setTimeout(() => {
                    const wrestlerSlugs = wrestlers.split(',');
                    if (wrestlerSlugs[0]) document.getElementById('wrestler1').value = wrestlerSlugs[0];
                    if (wrestlerSlugs[1]) document.getElementById('wrestler2').value = wrestlerSlugs[1];
                    if (wrestlerSlugs[2]) document.getElementById('wrestler3').value = wrestlerSlugs[2];
                    
                    validateSelection();
                    
                    // Auto-compare if valid
                    if (!document.getElementById('compareBtn').disabled) {
                        compareWrestlers();
                    }
                }, 100);
            }
        }
    </script>
</body>
</html>
