<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Wrestlers - AEW Wrestler Ratings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overlock:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Overlock', cursive;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        h1 {
            font-size: 2.5em;
            color: #ffd700;
            margin-bottom: 10px;
            font-weight: 900;
        }

        .subtitle {
            color: #999;
            font-size: 1.1em;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #ffd700;
            text-decoration: none;
            font-size: 1em;
            padding: 8px 16px;
            border: 1px solid #ffd700;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #ffd700;
            color: #1a1a2e;
        }

        /* Division Selection */
        .division-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .division-section h2 {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .division-options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .division-option {
            flex: 1;
            min-width: 150px;
        }

        .division-option input[type="radio"] {
            display: none;
        }

        .division-option label {
            display: block;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .division-option label:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .division-option input[type="radio"]:checked + label {
            background: #ffd700;
            color: #1a1a2e;
            border-color: #ffd700;
            font-weight: bold;
        }

        /* Wrestler Selection */
        .selection-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .selection-section h2 {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .wrestler-selectors {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .wrestler-selector {
            display: flex;
            flex-direction: column;
        }

        .wrestler-selector label {
            color: #ffd700;
            font-size: 0.9em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .wrestler-selector select {
            padding: 12px;
            font-size: 1em;
            font-family: 'Overlock', cursive;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .wrestler-selector select:hover {
            border-color: #ffd700;
        }

        .wrestler-selector select:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
        }

        .wrestler-selector select option {
            background: #1a1a2e;
            color: #fff;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            font-family: 'Overlock', cursive;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #ffd700;
            color: #1a1a2e;
        }

        .btn-primary:hover:not(:disabled) {
            background: #ffed4e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffd700;
            border: 1px solid #ffd700;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results Section (Placeholder for Phase 2-3) */
        .results-section {
            display: none;
            margin-top: 30px;
        }

        .results-section.active {
            display: block;
        }

        .stats-table-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .stats-table-container h2 {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .graph-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 25px;
        }

        .graph-container h2 {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px;
            color: #ffd700;
            font-size: 1.2em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Error State */
        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
            color: #ff6b6b;
        }

        /* Info Message */
        .info-message {
            text-align: center;
            color: #999;
            font-size: 0.95em;
            margin-top: 15px;
            font-style: italic;
        }

        /* ===== PHASE 2: Stats Comparison Cards ===== */
        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .wrestler-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
        }

        .wrestler-card:hover {
            border-color: #ffd700;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.2);
        }

        .wrestler-header-card {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
        }

        .wrestler-photo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #1a1a2e;
            border: 2px solid #ffd700;
            flex-shrink: 0;
        }

        .wrestler-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .wrestler-name-card {
            font-size: 1.3em;
            color: #ffd700;
            font-weight: bold;
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-row-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            transition: background 0.2s;
        }

        .stat-row-card:hover {
            background: rgba(255, 215, 0, 0.05);
        }

        .stat-label-card {
            color: #999;
            font-size: 0.9em;
        }

        .stat-value-card {
            color: #fff;
            font-weight: bold;
            font-size: 1.05em;
        }

        .stat-value-card.highlight {
            color: #ffd700;
            font-size: 1.2em;
        }

        .stat-value-card.good {
            color: #4ade80;
        }

        .stat-value-card.average {
            color: #fbbf24;
        }

        .stat-value-card.poor {
            color: #f87171;
        }
        /* ===== END PHASE 2 STYLES ===== */

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .division-options {
                flex-direction: column;
            }

            .division-option {
                min-width: 100%;
            }

            .wrestler-selectors {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.6em;
            }

            .division-section,
            .selection-section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🥊 Compare Wrestlers</h1>
            <p class="subtitle">Side-by-side wrestler comparison</p>
            <a href="index.html" class="back-link">← Back to Rankings</a>
        </header>

        <main>
            <!-- Division Selection -->
            <section class="division-section">
                <h2>Select Division</h2>
                <div class="division-options">
                    <div class="division-option">
                        <input type="radio" id="div-mens" name="division" value="mens" checked>
                        <label for="div-mens">Men</label>
                    </div>
                    <div class="division-option">
                        <input type="radio" id="div-womens" name="division" value="womens">
                        <label for="div-womens">Women</label>
                    </div>
                    <div class="division-option">
                        <input type="radio" id="div-menstag" name="division" value="menstag">
                        <label for="div-menstag">Men's Tag Teams</label>
                    </div>
                    <div class="division-option">
                        <input type="radio" id="div-womenstag" name="division" value="womenstag">
                        <label for="div-womenstag">Women's Tag Teams</label>
                    </div>
                    <div class="division-option">
                        <input type="radio" id="div-trios" name="division" value="trios">
                        <label for="div-trios">Trios</label>
                    </div>
                    <div class="division-option">
                        <input type="radio" id="div-all" name="division" value="all">
                        <label for="div-all">All Divisions</label>
                    </div>
                </div>
            </section>

            <!-- Wrestler Selection -->
            <section class="selection-section">
                <h2>Select Wrestlers to Compare</h2>
                <div id="loadingMessage" class="loading" style="display: none;">
                    Loading wrestler data
                </div>
                <div id="errorMessage" class="error" style="display: none;"></div>
                
                <div id="wrestlerSelectors" class="wrestler-selectors">
                    <div class="wrestler-selector">
                        <label for="wrestler1">Wrestler 1</label>
                        <select id="wrestler1">
                            <option value="">-- Select Wrestler --</option>
                        </select>
                    </div>
                    <div class="wrestler-selector">
                        <label for="wrestler2">Wrestler 2</label>
                        <select id="wrestler2">
                            <option value="">-- Select Wrestler --</option>
                        </select>
                    </div>
                    <div class="wrestler-selector">
                        <label for="wrestler3">Wrestler 3 (Optional)</label>
                        <select id="wrestler3">
                            <option value="">-- Select Wrestler --</option>
                        </select>
                    </div>
                </div>

                <p class="info-message">Select at least 2 wrestlers to compare</p>

                <div class="action-buttons">
                    <button id="compareBtn" class="btn btn-primary" disabled>Compare Wrestlers</button>
                    <button id="clearBtn" class="btn btn-secondary">Clear All</button>
                    <button id="copyLinkBtn" class="btn btn-secondary" style="display: none;">📋 Copy Link</button>
                </div>
            </section>

            <!-- Results Section (Hidden until comparison is made) -->
            <section id="resultsSection" class="results-section">
                <div class="stats-table-container">
                    <h2>📊 Performance Comparison</h2>
                    <div id="statsTable">
                        <!-- Stats table will be inserted here in Phase 2 -->
                    </div>
                </div>

                <div class="graph-container">
                    <h2>📈 Rating History</h2>
                    <div id="graphCanvas">
                        <!-- Chart.js graph will be inserted here in Phase 3 -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Global variables
        let statisticsData = null;
        let selectedDivision = 'mens';

        // Initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            await loadStatisticsData();
            setupEventListeners();
            checkURLParams();
        });

        // Load statistics.json to get wrestler lists
        async function loadStatisticsData() {
            const loadingMsg = document.getElementById('loadingMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            try {
                loadingMsg.style.display = 'block';
                const response = await fetch('statistics.json');
                
                if (!response.ok) {
                    throw new Error('Failed to load statistics data');
                }
                
                statisticsData = await response.json();
                loadingMsg.style.display = 'none';
                
                // Populate dropdowns with initial division (mens)
                populateWrestlerDropdowns();
                
            } catch (error) {
                console.error('Error loading statistics:', error);
                loadingMsg.style.display = 'none';
                errorMsg.textContent = 'Error loading wrestler data. Please refresh the page.';
                errorMsg.style.display = 'block';
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Division radio buttons
            document.querySelectorAll('input[name="division"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    selectedDivision = e.target.value;
                    populateWrestlerDropdowns();
                    validateSelection();
                });
            });

            // Wrestler dropdowns
            ['wrestler1', 'wrestler2', 'wrestler3'].forEach(id => {
                document.getElementById(id).addEventListener('change', validateSelection);
            });

            // Compare button
            document.getElementById('compareBtn').addEventListener('click', compareWrestlers);

            // Clear button
            document.getElementById('clearBtn').addEventListener('click', clearSelection);

            // Copy link button
            document.getElementById('copyLinkBtn').addEventListener('click', copyShareLink);
        }

        // Populate wrestler dropdowns based on selected division
        function populateWrestlerDropdowns() {
            if (!statisticsData) return;

            const dropdowns = ['wrestler1', 'wrestler2', 'wrestler3'];
            let wrestlers = [];

            if (selectedDivision === 'all') {
                // Combine all divisions
                const divisions = ['mens', 'womens', 'menstag', 'womenstag', 'trios'];
                divisions.forEach(div => {
                    if (statisticsData[div]) {
                        statisticsData[div].forEach(w => {
                            wrestlers.push({
                                name: w.name,
                                division: div
                            });
                        });
                    }
                });
            } else {
                // Single division
                if (statisticsData[selectedDivision]) {
                    wrestlers = statisticsData[selectedDivision].map(w => ({
                        name: w.name,
                        division: selectedDivision
                    }));
                }
            }

            // Sort alphabetically
            wrestlers.sort((a, b) => a.name.localeCompare(b.name));

            // Populate each dropdown
            dropdowns.forEach(dropdownId => {
                const select = document.getElementById(dropdownId);
                const currentValue = select.value;
                
                select.innerHTML = '<option value="">-- Select Wrestler --</option>';
                
                wrestlers.forEach(wrestler => {
                    const option = document.createElement('option');
                    option.value = createSlug(wrestler.name);
                    
                    // Show division label for "All Divisions" mode
                    if (selectedDivision === 'all') {
                        const divLabel = getDivisionLabel(wrestler.division);
                        option.textContent = `${wrestler.name} (${divLabel})`;
                    } else {
                        option.textContent = wrestler.name;
                    }
                    
                    option.dataset.name = wrestler.name;
                    option.dataset.division = wrestler.division;
                    select.appendChild(option);
                });

                // Restore previous selection if still available
                if (currentValue) {
                    const optionExists = Array.from(select.options).some(opt => opt.value === currentValue);
                    if (optionExists) {
                        select.value = currentValue;
                    }
                }
            });
        }

        // Get human-readable division label
        function getDivisionLabel(div) {
            const labels = {
                'mens': 'Men',
                'womens': 'Women',
                'menstag': "Men's Tag",
                'womenstag': "Women's Tag",
                'trios': 'Trios'
            };
            return labels[div] || div;
        }

        // Create slug from wrestler name
        function createSlug(name) {
            return name.toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .trim();
        }

        // Validate selection and enable/disable compare button
        function validateSelection() {
            const wrestler1 = document.getElementById('wrestler1').value;
            const wrestler2 = document.getElementById('wrestler2').value;
            const compareBtn = document.getElementById('compareBtn');

            // Need at least 2 wrestlers selected
            const isValid = wrestler1 && wrestler2;
            compareBtn.disabled = !isValid;
        }

        // Compare wrestlers (Phase 2 implementation)
        async function compareWrestlers() {
            const wrestler1 = document.getElementById('wrestler1').value;
            const wrestler2 = document.getElementById('wrestler2').value;
            const wrestler3 = document.getElementById('wrestler3').value;

            console.log('Comparing:', { wrestler1, wrestler2, wrestler3 });

            // Show results section
            document.getElementById('resultsSection').classList.add('active');
            document.getElementById('copyLinkBtn').style.display = 'inline-block';

            // Update URL
            updateURL();

            // PHASE 2: Fetch wrestler data and build stats table
            const statsTableDiv = document.getElementById('statsTable');
            statsTableDiv.innerHTML = '<div class="loading">Loading wrestler data</div>';

            try {
                // Get selected wrestler slugs
                const selectedWrestlers = [wrestler1, wrestler2, wrestler3].filter(w => w);
                
                // Load data for each wrestler
                const wrestlerDataPromises = selectedWrestlers.map(slug => loadWrestlerData(slug));
                const wrestlerData = await Promise.all(wrestlerDataPromises);

                // Build comparison table
                statsTableDiv.innerHTML = buildStatsTable(wrestlerData);

            } catch (error) {
                console.error('Error loading wrestler data:', error);
                statsTableDiv.innerHTML = `<div class="error">Error loading wrestler data: ${error.message}</div>`;
            }
            
            // TODO: Phase 3 - Build line graph
        }

        // Clear all selections
        function clearSelection() {
            document.getElementById('wrestler1').value = '';
            document.getElementById('wrestler2').value = '';
            document.getElementById('wrestler3').value = '';
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('copyLinkBtn').style.display = 'none';
            validateSelection();
            
            // Clear URL
            window.history.pushState({}, '', 'wrestler-compare.html');
        }

        // Update URL with current selection
        function updateURL() {
            const wrestler1 = document.getElementById('wrestler1').value;
            const wrestler2 = document.getElementById('wrestler2').value;
            const wrestler3 = document.getElementById('wrestler3').value;

            const params = new URLSearchParams();
            params.set('division', selectedDivision);
            
            const wrestlers = [wrestler1, wrestler2, wrestler3].filter(w => w);
            if (wrestlers.length > 0) {
                params.set('wrestlers', wrestlers.join(','));
            }

            const newURL = `${window.location.pathname}?${params.toString()}`;
            window.history.pushState({}, '', newURL);
        }

        // Copy shareable link to clipboard
        async function copyShareLink() {
            const url = window.location.href;
            
            try {
                await navigator.clipboard.writeText(url);
                
                // Visual feedback
                const btn = document.getElementById('copyLinkBtn');
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.style.background = 'rgba(40, 167, 69, 0.3)';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 2000);
                
            } catch (error) {
                console.error('Failed to copy link:', error);
                alert('Failed to copy link. Please copy manually from the address bar.');
            }
        }

        // ===== PHASE 2 FUNCTIONS =====
        
        // Load individual wrestler data
        async function loadWrestlerData(slug) {
            try {
                // Try individual wrestler file first
                const response = await fetch(`wrestlers/${slug}.json`);
                if (response.ok) {
                    return await response.json();
                }
                throw new Error(`Wrestler file not found: ${slug}`);
            } catch (error) {
                console.error(`Error loading ${slug}:`, error);
                // Fallback: use statistics.json data
                if (statisticsData) {
                    for (const division in statisticsData) {
                        const wrestler = statisticsData[division].find(w => 
                            createSlug(w.name) === slug
                        );
                        if (wrestler) {
                            wrestler.division = division;
                            return wrestler;
                        }
                    }
                }
                throw new Error(`Could not load data for ${slug}`);
            }
        }

        // Build stats comparison table HTML
        function buildStatsTable(wrestlerData) {
            return `
                <div class="comparison-grid">
                    ${wrestlerData.map(data => createWrestlerCard(data)).join('')}
                </div>
            `;
        }

        // Create individual wrestler card
        function createWrestlerCard(data) {
            const initials = getInitials(data.name);
            const photoHTML = data.photo 
                ? `<img src="${data.photo}" alt="${data.name}">`
                : initials;

            // Calculate stats safely with fallbacks
const currentRating = data.currentRating || data.current || 0;
const peakRating = data.peakRating || data.peak || 0;
const floorRating = data.floorRating || data.floor || 0;

const avgRating = data.ratings && data.ratings.length > 0
    ? (data.ratings.reduce((a, b) => a + b, 0) / data.ratings.length).toFixed(2)
    : (data.average || currentRating || 0).toFixed(2);

const peakRank = data.peakRank || (data.ranks && data.ranks.length > 0 ? Math.min(...data.ranks) : data.currentRank) || '-';

const weeksAtOne = data.weeksAtNumber1 || 0;
const totalWeeks = data.totalWeeks || data.totalWeeksRanked || (data.weeks?.length) || 0;
const totalMatches = data.totalMatches || 0;

            return `
                <div class="wrestler-card">
                    <div class="wrestler-header-card">
                        <div class="wrestler-photo">
                            ${photoHTML}
                        </div>
                        <div>
                            <div class="wrestler-name-card">${data.name}</div>
                            <div style="color: #999; font-size: 0.85em;">${getDivisionLabel(data.division)}</div>
                        </div>
                    </div>
                    <div class="stats-list">
                        <div class="stat-row-card">
                            <span class="stat-label-card">Current Rating</span>
                            <span class="stat-value-card highlight ${getRatingClass(currentRating)}">${currentRating.toFixed(2)}</span>
                        </div>
                        <div class="stat-row-card">
                            <span class="stat-label-card">Peak Rating</span>
                            <span class="stat-value-card">${peakRating.toFixed(2)}</span>
                        </div>
                        <div class="stat-row-card">
                            <span class="stat-label-card">Floor Rating</span>
                            <span class="stat-value-card">${floorRating.toFixed(2)}</span>
                        </div>
                        <div class="stat-row-card">
                            <span class="stat-label-card">Average Rating</span>
                            <span class="stat-value-card">${avgRating}</span>
                        </div>
                        <div class="stat-row-card">
                            <span class="stat-label-card">Total Weeks</span>
                            <span class="stat-value-card">${formatNumber(totalWeeks)}</span>
                        </div>
                        <div class="stat-row-card">
                            <span class="stat-label-card">Total Matches</span>
                            <span class="stat-value-card">${formatNumber(totalMatches)}</span>
                        </div>
                        <div class="stat-row-card">
                            <span class="stat-label-card">Best Rank</span>
                            <span class="stat-value-card">#${peakRank}</span>
                        </div>
                        <div class="stat-row-card">
                            <span class="stat-label-card">Weeks at #1</span>
                            <span class="stat-value-card ${weeksAtOne > 0 ? 'good' : ''}">${weeksAtOne}</span>
                        </div>
                        ${data.peakWeek ? `
                        <div class="stat-row-card">
                            <span class="stat-label-card">Peak Week</span>
                            <span class="stat-value-card" style="font-size: 0.85em;">${data.peakWeek}</span>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Helper: Get initials from name
        function getInitials(name) {
            if (!name) return '?';
            const words = name.trim().split(' ');
            if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
            return words.map(w => w[0]).join('').substring(0, 2).toUpperCase();
        }

        // Helper: Get rating color class
        function getRatingClass(rating) {
            if (rating >= 100) return 'good';
            if (rating >= 95) return 'average';
            return 'poor';
        }

        // Helper: Format number with commas
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // ===== END PHASE 2 FUNCTIONS =====

        // Check URL parameters on page load
        function checkURLParams() {
            const params = new URLSearchParams(window.location.search);
            const division = params.get('division');
            const wrestlers = params.get('wrestlers');

            if (division && wrestlers) {
                // Set division
                const divisionRadio = document.getElementById(`div-${division}`);
                if (divisionRadio) {
                    divisionRadio.checked = true;
                    selectedDivision = division;
                    populateWrestlerDropdowns();
                }

                // Set wrestlers (with small delay to ensure dropdowns are populated)
                setTimeout(() => {
                    const wrestlerSlugs = wrestlers.split(',');
                    if (wrestlerSlugs[0]) document.getElementById('wrestler1').value = wrestlerSlugs[0];
                    if (wrestlerSlugs[1]) document.getElementById('wrestler2').value = wrestlerSlugs[1];
                    if (wrestlerSlugs[2]) document.getElementById('wrestler3').value = wrestlerSlugs[2];
                    
                    validateSelection();
                    
                    // Auto-compare if valid
                    if (!document.getElementById('compareBtn').disabled) {
                        compareWrestlers();
                    }
                }, 100);
            }
        }
    </script>
</body>
</html>
